[project]
name = "senior-code-mcp"
version = "0.1.0"
description = "Senior Code MCP — semantic + structural code search for coding agents"
readme = "README.md"
authors = [
    { name = "Tamaz_Sujashvili", email = "Notavailablehacker@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp",
    "qdrant-client",
    # 0.26.0 segfaults on node access (CPython 3.13, macOS arm64); 0.25.2 is stable.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python",
    "networkx",
    "httpx",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-java>=0.23.5",
]

[project.optional-dependencies]
eval = [
    "coir-eval",
    "numpy",
]

[project.scripts]
senior-code-mcp = "senior_code_mcp.server:main"
senior-code-ingest = "senior_code_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
